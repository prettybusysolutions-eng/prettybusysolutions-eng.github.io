name: Browser and offline shell
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node --test tests/service-worker.test.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify desktop, mobile and offline shell
        run: |
          python -m http.server 8080 --bind 127.0.0.1 >/tmp/static-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-smoke.cjs
